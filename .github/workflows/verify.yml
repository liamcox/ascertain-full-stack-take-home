name: Verify full stack

on:
  push:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests on PostgreSQL 17 and SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ascertain
          POSTGRES_PASSWORD: ascertain_ci
          POSTGRES_DB: ascertain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ascertain -d ascertain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ascertain:ascertain_ci@localhost:5432/ascertain_test
      DATABASE_URL: postgresql+psycopg://ascertain:ascertain_ci@localhost:5432/ascertain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check backend dependency compatibility
        run: python -m pip check
      - name: Run API tests against isolated PostgreSQL schemas
        working-directory: backend
        run: python -m pytest
      - name: Run API tests against isolated SQLite databases
        working-directory: backend
        env:
          TEST_DATABASE_URL: ''
        run: python -m pytest

  frontend:
    name: Frontend checks and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck and build production assets
        run: npm run build

  compose:
    name: Docker Compose, API smoke, and browser workflows
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build and start the complete stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Exercise the app through the frontend API proxy
        run: >-
          python scripts/smoke_test.py
          --api-base http://127.0.0.1:3000/api
          --frontend-url http://127.0.0.1:3000
      - name: Exercise React forms, note lifecycle, and mobile layouts
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Show container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop services and remove disposable test volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
