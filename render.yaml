# Import as a Render Blueprint after publishing the repository.
# DATABASE_URL and CORS_ORIGINS are supplied in Render, never committed.
services:
  - type: web
    name: ascertain-care-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DATA
        value: "true"

